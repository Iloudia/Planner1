<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      try {
        const storedLanguage = localStorage.getItem("planner.language.preference.v2")
        const browserLanguages = navigator.languages?.length ? navigator.languages : [navigator.language]
        const supportedLanguage = browserLanguages.find((language) => /^(fr|en)(-|$)/i.test(String(language)))
        const initialLanguage = storedLanguage || (String(supportedLanguage || "fr").toLowerCase().startsWith("en") ? "en" : "fr")
        document.documentElement.lang = String(initialLanguage).toLowerCase().startsWith("en") ? "en" : "fr"
        const personalizedRoutePrefixes = [
          "/bienvenue", "/home", "/sport", "/journaling", "/mindset", "/self-love",
          "/manifestation", "/wishlist", "/calendrier", "/finances", "/routine", "/goals",
          "/diet", "/menu", "/alimentation", "/profil", "/archives", "/mes-achats",
          "/project", "/parametres", "/admin",
        ]
        const currentPath = window.location.pathname.toLowerCase().replace(/\/$/, "") || "/"
        const isPersonalizedRoute = currentPath === "/blog/nouvel-article"
          || personalizedRoutePrefixes.some((prefix) => currentPath === prefix || currentPath.startsWith(`${prefix}/`))
        const storedColorMode = localStorage.getItem("planner.color-mode.v1")
        if (isPersonalizedRoute && (storedColorMode === "dark" || storedColorMode === "light")) {
          document.documentElement.dataset.colorMode = storedColorMode
          document.documentElement.style.colorScheme = storedColorMode
        } else {
          document.documentElement.dataset.colorMode = "light"
          document.documentElement.style.colorScheme = "light"
        }
      } catch {
        // Le mode sera synchronisé par l'application si le stockage local est indisponible.
      }
    </script>
    <title>Me&rituals | Planner, journaling, routines et organisation du quotidien</title>

      name="description"
      content="Me&rituals t'aide à organiser ton quotidien avec un planner en ligne, du journaling, des routines, un suivi sport, finances, wishlist et repas."
